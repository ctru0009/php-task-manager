# Files that must never be served over HTTP.
#
# docker-compose bind-mounts the project over the Apache docroot so edits are
# live. That also puts .env, .git, the tests and the schema inside the web
# root, so without these rules they are downloadable:
#   curl http://localhost:8080/.env          -> the database password
#   curl http://localhost:8080/.git/config   -> repository metadata
#   curl http://localhost:8080/tests/bootstrap.php -> drops and rebuilds a database
# PHP includes read files from disk, so denying them here does not affect the
# application itself.

<Directory /var/www/html>
    Options -Indexes

    <FilesMatch "(^\.|^composer\.(json|lock)$|^phpunit\.xml(\.dist)?$|^schema\.sql$|^(README|AGENTS)\.md$)">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/html/\.+">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/var/www/html/(tests|docker|vendor|docs)($|/)">
    Require all denied
</DirectoryMatch>
