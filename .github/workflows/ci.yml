name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: task_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - run: composer validate --strict

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: mysql -h 127.0.0.1 -uroot -prootpass < schema.sql

      - run: php vendor/bin/phpunit --no-coverage
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: task_manager_test
          DB_USER: root
          DB_PASSWORD: rootpass
